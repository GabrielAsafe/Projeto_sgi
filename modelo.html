<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Projeto prático Avaliação SGI</title>
    <link rel="stylesheet" href="/css/3dstyles.css" />
  </head>
  <body>
    <div id="container">
      <div id="canvas-container">
        <div id="displayText">Animação: Nenhuma</div>

        <canvas id="three-canvas"></canvas>
      </div>

      <!-- CONTROLOS ESTILO VIDEO PLAYER -->
      <div id="contextMenu">
        <!-- Abrir / Fechar tampa -->
        <button class="icon-btn" id="open_close_lid" title="Abrir/Fechar Tampa">
          🔓
        </button>

        <!-- Rodar / Parar disco -->
        <button
          class="icon-btn"
          id="rotate_stop_spin"
          title="Rodar/Parar Disco"
        >
          💿
        </button>

        <!-- Agulha -->
        <button class="icon-btn" id="position_remove_neddle" title="Agulha">
          📍
        </button>

        <!-- Pausa -->
        <button class="icon-btn" id="pause" title="Pausar">⏸</button>

        <!-- Continuar -->
        <button class="icon-btn" id="resume" title="Continuar">▶</button>

        <!-- Reiniciar -->
        <button class="icon-btn" id="restart" title="Reiniciar">⟳</button>

        <!-- Parar -->
        <button class="icon-btn" id="stop" title="Parar">⛔</button>

        <!-- Mudar Cor -->
        <button class="icon-btn" id="btn_cor" title="Mudar Cor">🎨</button>

        <!-- Mudar Textura -->
        <button class="icon-btn" id="btn_material" title="Mudar Textura">
          🧵
        </button>

        <!-- Repor -->
        <button class="icon-btn" id="btn_repor" title="Desfazer">↩</button>
      </div>

      <div class="colors" id="colors">
        <!-- cores -->
        <label for="luz_x">X:</label>
        <input type="range" id="luz_x" min="-5" max="5" value="1" step="0.1" />
        <span id="valor_x">0</span>

        <label for="luz_y">Y:</label>
        <input type="range" id="luz_y" min="-5" max="5" value="0" step="0.1" />
        <span id="valor_y">0</span>

        <label for="luz_z">Z:</label>
        <input type="range" id="luz_z" min="-5" max="5" value="0" step="0.1" />
        <span id="valor_z">0</span>

        <label for="luz_intensidade">Intensidade:</label>
        <input
          type="range"
          id="luz_intensidade"
          min="0"
          max="10"
          value="1"
          step="0.1"
        />
        <span id="valor_intensidade">1</span>

        <label for="cor_luz">Cor da luz:</label>
        <input type="color" id="cor_luz" value="#ffffff" />
        <span id="valor_cor">#ffffff</span>
      </div>
    </div>

    <!-- Scripts -->
    <script src="/node_modules/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>

    <script type="module" defer src="./scripts/main.js"></script>
  </body>
</html>
